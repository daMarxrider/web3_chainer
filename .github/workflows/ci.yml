# Tests and type checks on every push and pull request.
#
# - checks: type checks (root and GUI) and `npm test`: the core, the CLI run end to end against the
#   fake network (testing/fakenet, nothing leaves the runner), and the GUI's formatting helpers.
# - gui: the GUI in headless Chrome against the same fake network (`npm run test:gui`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type checks and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck -w @chainer/gui
      - run: npm test

  gui:
    name: GUI in a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's sandbox needs; allow them
      # on the runner rather than turning the sandbox off.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:gui
        env:
          CHROMIUM: google-chrome
